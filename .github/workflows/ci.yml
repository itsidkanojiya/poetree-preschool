name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, typecheck, test
    runs-on: ubuntu-latest

    # A real MySQL so the tenant-isolation and plan-blocking suites actually run
    # here instead of skipping. They are the gate for this phase.
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: poetree_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=15

    env:
      DATABASE_URL: mysql://root:root@127.0.0.1:3306/poetree_test
      TEST_DATABASE_URL: mysql://root:root@127.0.0.1:3306/poetree_test
      JWT_ACCESS_SECRET: ci-access-secret-that-is-long-enough-0000000
      JWT_REFRESH_SECRET: ci-refresh-secret-that-is-long-enough-111111

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build shared contracts
        run: npm run build -w @poetree/shared

      - name: Generate Prisma client
        run: npm run db:generate -w @poetree/api

      - name: Apply migrations
        run: npx prisma migrate deploy --schema apps/api/prisma/schema.prisma

      - name: Validate Prisma schema
        run: npx prisma validate --schema apps/api/prisma/schema.prisma

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test

  mobile:
    name: Flutter analyse and test
    runs-on: ubuntu-latest

    # The app was unguarded until now: `flutter analyze` only ever ran on a
    # developer's machine, so a broken mobile build could reach main behind a
    # green tick. Kept as a separate job because it needs no MySQL and no Node,
    # and it should not queue behind the API suite.
    defaults:
      run:
        working-directory: apps/mobile

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          # Pinned to the channel the app was written against. `stable` floating
          # would turn an upstream release into a build failure on an unrelated
          # pull request.
          channel: stable
          flutter-version: 3.44.9
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyse
        # Warnings fail too. A nullability or unawaited-future warning in a
        # screen a parent uses daily is not a style opinion.
        run: flutter analyze --fatal-infos --fatal-warnings

      - name: Test
        run: flutter test

  build:
    name: Production build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci --no-audit --no-fund

      - name: Build all workspaces
        env:
          # Only needed so Prisma can resolve the datasource at generate time;
          # nothing connects during a build.
          DATABASE_URL: mysql://user:pass@127.0.0.1:3306/placeholder
        run: npm run build
