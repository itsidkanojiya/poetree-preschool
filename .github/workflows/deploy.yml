name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# Never let two deploys touch the VPS at once.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  # CI and Deploy previously ran independently, so a red CI did not stop a
  # release — code that failed lint shipped to production anyway. This gate runs
  # the same checks and the deploy job cannot start until it passes.
  verify:
    name: Verify before releasing
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: poetree_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=15

    env:
      DATABASE_URL: mysql://root:root@127.0.0.1:3306/poetree_test
      TEST_DATABASE_URL: mysql://root:root@127.0.0.1:3306/poetree_test
      JWT_ACCESS_SECRET: ci-access-secret-that-is-long-enough-0000000
      JWT_REFRESH_SECRET: ci-refresh-secret-that-is-long-enough-111111

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build -w @poetree/shared
      - run: npm run db:generate -w @poetree/api
      - run: npx prisma migrate deploy --schema apps/api/prisma/schema.prisma
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test

  deploy:
    name: Build and deploy to the VPS
    runs-on: ubuntu-latest
    environment: production
    needs: verify

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build
        env:
          DATABASE_URL: mysql://user:pass@127.0.0.1:3306/placeholder
        run: npm run build

      - name: Configure SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -euo pipefail

          if [ -z "${VPS_HOST:-}" ]; then
            echo "::error::VPS_HOST secret is empty. Set it in Settings > Secrets and variables > Actions."
            exit 1
          fi
          if [ -z "${VPS_SSH_KEY:-}" ]; then
            echo "::error::VPS_SSH_KEY secret is empty."
            exit 1
          fi

          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          # ssh-keyscan reaches over the network, so a single blip on the runner
          # would otherwise fail the whole deploy under `set -e`. Retry before
          # giving up, and check we actually captured a host key rather than
          # trusting the exit code.
          for attempt in 1 2 3; do
            ssh-keyscan -T 10 -p "${VPS_PORT:-22}" -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
            if [ -s ~/.ssh/known_hosts ]; then
              echo "Host key captured on attempt ${attempt}"
              break
            fi
            echo "ssh-keyscan attempt ${attempt} returned nothing; retrying"
            sleep 5
          done

          if [ ! -s ~/.ssh/known_hosts ]; then
            echo "::error::Could not reach ${VPS_HOST}:${VPS_PORT:-22} to read its host key."
            exit 1
          fi

      - name: Ship the build
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
        run: |
          set -euo pipefail
          # --delete is scoped to our own app root. The other projects on this
          # shared box live in sibling directories and are never in scope.
          rsync -az --delete \
            -e "ssh -i ~/.ssh/deploy_key -p ${VPS_PORT:-22}" \
            --exclude '.git' \
            --exclude 'node_modules' \
            --exclude '.env' \
            --exclude '.env.local' \
            --exclude 'apps/api/.env' \
            --exclude 'apps/web/.env.local' \
            ./ "$VPS_USER@$VPS_HOST:/var/www/poetree-preschool/"

      - name: Migrate, reload and health-check
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/deploy_key -p "${VPS_PORT:-22}" "$VPS_USER@$VPS_HOST" \
            'bash /var/www/poetree-preschool/infra/deploy.sh'

      - name: Public health check
        if: ${{ vars.PUBLIC_HEALTH_URL != '' }}
        run: |
          set -euo pipefail
          status=$(curl -sS -o /dev/null -w '%{http_code}' "${{ vars.PUBLIC_HEALTH_URL }}")
          echo "Health endpoint returned $status"
          test "$status" = "200"

      - name: Clean up the key
        if: always()
        run: rm -f ~/.ssh/deploy_key
