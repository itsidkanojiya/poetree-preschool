org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# Kotlin 2.3.20's incremental runner registers the same cache file twice and
# then dies closing it — ":image_picker_android:compileDebugKotlin" failed with
# "Storage for ...class-fq-name-to-source.tab is already registered". It happens
# on a clean build with an empty build directory too, so it is the toolchain and
# not a stale cache; deleting build/ does not help.
#
# The cost is small here: these are third-party plugin modules whose Kotlin
# nobody edits, so they only recompile when a dependency is bumped. Revisit when
# Kotlin is next upgraded — this is a workaround, not a preference.
kotlin.incremental=false
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
