name: poetree_school
description: >-
  Poetree preschool app. One codebase; each school gets its own branded Android
  build produced by tool/configure_school.dart, so onboarding a new school needs
  no code change.
publish_to: "none"

# Version is rewritten per school at build time from SchoolAppConfig.
version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter

  # State. Riverpod rather than Provider because the parent/teacher split means
  # the same screens read different scopes, and overrides make that explicit.
  flutter_riverpod: ^3.0.1
  riverpod_annotation: ^3.0.1

  # Networking. Dio for the interceptor hook the refresh-token flow needs.
  dio: ^5.9.0

  # Tokens never touch shared preferences — Keystore on Android, Keychain on iOS.
  flutter_secure_storage: ^9.2.4

  go_router: ^16.2.5
  intl: ^0.20.2

  # Offline attendance. A teacher marks a register with no signal and it syncs
  # later, which is why PUT /attendance upserts a whole session.
  drift: ^2.28.2
  sqlite3_flutter_libs: ^0.5.40
  path_provider: ^2.1.5
  path: ^1.9.1
  connectivity_plus: ^7.0.0

  cached_network_image: ^3.4.1
  intl_phone_field: ^3.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.10.3
  riverpod_generator: ^3.0.1
  drift_dev: ^2.28.2
  custom_lint: ^0.8.1
  riverpod_lint: ^3.0.1

flutter:
  uses-material-design: true
  assets:
    # Written by tool/configure_school.dart from the school's SchoolAppConfig.
    - assets/branding/
  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
          weight: 400
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
