name: poetree_school
description: >-
  Poetree preschool app. One codebase; each school gets its own branded Android
  build produced by tool/configure_school.dart, so onboarding a new school needs
  no code change.
publish_to: "none"

# Version is rewritten per school at build time from SchoolAppConfig.
version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter

  # State, routing and dependency injection. GetX is the team's stack; its
  # lookups resolve at runtime rather than compile time, so controllers are
  # registered through bindings (see lib/core/routes) instead of ad-hoc Get.put
  # calls scattered through widgets.
  get: ^4.7.2

  # Networking. Dio for the interceptor hook the refresh-token flow needs.
  dio: ^5.9.0

  # Tokens never touch shared preferences — Keystore on Android, Keychain on iOS.
  flutter_secure_storage: ^9.2.4

  intl: ^0.20.2

  # Offline attendance. A teacher marks a register with no signal and it syncs
  # later, which is why PUT /attendance upserts a whole session.
  drift: ^2.28.2
  sqlite3_flutter_libs: ^0.5.40
  path_provider: ^2.1.5
  path: ^1.9.1
  connectivity_plus: ^7.0.0

  cached_network_image: ^3.4.1
  intl_phone_field: ^3.2.0

  # A parent photographing their child's finished homework. Camera and gallery
  # both — most take the picture there and then, some already have.
  image_picker: ^1.1.2

  # The animation a child watches before a book opens. Played inside the app,
  # not handed to the YouTube app: this is the only way to know the video
  # actually finished rather than a four-year-old tapping away from it, and it
  # keeps them out of YouTube's recommendations.
  #
  # The iframe player rather than youtube_player_flutter: that one pulls in
  # flutter_inappwebview, whose Android module still calls
  # getDefaultProguardFile('proguard-android.txt') — removed in AGP 9, so the
  # app would not build at all. This one sits on Flutter's own webview.
  youtube_player_iframe: ^5.2.0

  # Push. Each school's build needs its own android/app/google-services.json —
  # tool/configure_school.dart puts it there. A build without one still runs:
  # the app degrades to the in-app inbox rather than refusing to start.
  firebase_core: ^4.1.1
  firebase_messaging: ^16.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.10.3
  drift_dev: ^2.28.2

flutter:
  uses-material-design: true
  assets:
    # Written by tool/configure_school.dart from the school's SchoolAppConfig.
    - assets/branding/
  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
          weight: 400
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
