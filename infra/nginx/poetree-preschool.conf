# Poetree preschool platform — school.poetreepublications.com
#
# Mirrors the poetree-portal site block: ONE subdomain, /api/ to the API and
# everything else to Next.js. Unique server_name, and NO default_server — this
# box has no explicit default, so the alphabetically-first site (plumber-crm)
# is the implicit one. Naming this file poetree-preschool keeps it sorted after
# plumber-crm, so that behaviour is unchanged.
#
#   sudo cp infra/nginx/poetree-preschool.conf /etc/nginx/sites-available/poetree-preschool
#   sudo ln -s /etc/nginx/sites-available/poetree-preschool /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d school.poetreepublications.com
#
# `nginx -t` before reloading is not optional here — a bad config would take
# down plumber-crm, poetreepublications.com and store.* along with us.

server {
    listen 80;
    listen [::]:80;
    server_name school.poetreepublications.com;

    client_max_body_size 2m;

    access_log /var/log/nginx/poetree-preschool.access.log;
    error_log  /var/log/nginx/poetree-preschool.error.log;

    # API on 4200. No trailing slash on proxy_pass, so /api/v1/... is forwarded
    # intact and the Express router sees the path it expects.
    location /api/ {
        proxy_pass http://127.0.0.1:4200;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        # The API sets `trust proxy`, so rate limiting and audit logs record the
        # real client address rather than 127.0.0.1.
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 60s;
    }

    # Next.js fingerprints these, so they are safe to cache hard.
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3200;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Admin portal on 3200.
    location / {
        proxy_pass http://127.0.0.1:3200;
        proxy_http_version 1.1;

        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        proxy_read_timeout 60s;
    }
}
