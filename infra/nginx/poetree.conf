# Nginx front door for the Poetree platform.
#
#   sudo cp infra/nginx/poetree.conf /etc/nginx/sites-available/poetree
#   sudo ln -s /etc/nginx/sites-available/poetree /etc/nginx/sites-enabled/poetree
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#
# Then obtain certificates, which rewrites these blocks for TLS:
#   sudo certbot --nginx -d api.example.com -d app.example.com
#
# Replace api.example.com / app.example.com with the real domains before use.

# ---------------------------------------------------------------------------
# API — api.<domain>
# ---------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name api.example.com;

    # Uploads and payloads stay small in Phase 1; raise deliberately later.
    client_max_body_size 2m;

    access_log /var/log/nginx/poetree-api.access.log;
    error_log  /var/log/nginx/poetree-api.error.log;

    location / {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        # The API sets `trust proxy`, so rate limiting and audit logs read the
        # real client address from here.
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        'upgrade';

        proxy_read_timeout 60s;
    }
}

# ---------------------------------------------------------------------------
# Admin portal — app.<domain>
# ---------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name app.example.com;

    access_log /var/log/nginx/poetree-web.access.log;
    error_log  /var/log/nginx/poetree-web.error.log;

    # Next.js fingerprints these, so they are safe to cache hard.
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_cache_valid 200 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        'upgrade';

        proxy_read_timeout 60s;
    }
}
